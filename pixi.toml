# BAF-portal data pipeline environment.
#
#   pixi install
#   pixi run build-data     # fetch -> project -> validate -> emit site/public/data/v<date>/
#   pixi run layout         # 6LTJ -> site/src/lib/layouts/cBAF.json
#   pixi run beads          # 6LTJ -> site/src/lib/models/cBAF.json (3D bead model)
#   pixi run verify         # re-check composition.yaml PMIDs/UniProt/HGNC/PDB live
#   pixi run test           # pytest (network-free where cached)

[workspace]
name = "baf-portal"
version = "0.1.0"
description = "Static portal of human BAF (mSWI/SNF) complexes, subunit domain maps and disease mutations"
authors = ["Brent Chick"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = "3.12.*"
requests = "*"
pyyaml = "*"
numpy = "*"
scipy = "*"
gemmi = "*"
pytest = "*"
scikit-image = ">=0.26.0,<0.27"

[tasks]
build-data = "python -m pipeline.build"
layout = "python -m pipeline.cartoon_layout"
beads = "python -m pipeline.bead_model"
cartoons = "python -m pipeline.cartoon2d"
verify = "python -m pipeline.verify_composition"
test = "pytest -q tests"
