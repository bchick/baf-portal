# BAF-portal curated composition of human mSWI/SNF (BAF) complexes.
#
# Every membership claim carries at least one PMID. PMIDs were resolved with
# NCBI ESummary on 2026-09-29 (title/first author checked; see `references`).
# `pipeline/verify_composition.py` re-checks every PMID and every UniProt/HGNC
# identifier in this file against the live APIs.
#
# Conventions
#   slot.members      paralogs that fill the slot, mutually exclusive in one
#                     complex unless `stoichiometry` says otherwise
#   slot.contested    true when the literature disagrees about the slot or one
#                     of its members; `contested_notes` lists the sources.
#   needs_review      a claim the curator (BC) has not yet checked against the
#                     paper's primary figure. Phase 0 review gate.
#   species           all complexes in `complexes` are characterised in human
#                     cells.

version: 2026-09-30
curator: Brent Chick

references:
  "8895581":  Wang 1996 EMBO J — purification of mammalian SWI/SNF (BAF) complexes
  "11073988": Nie 2000 Mol Cell Biol — BAF250 (ARID1A) specificity subunit
  "11078522": Xue 2000 PNAS — human SWI/SNF-B (PBAF) related to yeast RSC; BAF180
  "15985610": Yan 2005 Genes Dev — BAF200 (ARID2) PBAF specificity subunit
  "18809673": Kaeser 2008 J Biol Chem — BRD7 is a PBAF-specific subunit
  "22442726": Middeljans 2012 PLoS One — SS18 defines human BAF-type complexes
  "23540691": Kadoch & Crabtree 2013 Cell — SS18-SSX disrupts BAF
  "23644491": Kadoch 2013 Nat Genet — proteomics of mSWI/SNF; BCL7A/B/C, BCL11
  "29374058": Alpsoy & Dykhuizen 2018 J Biol Chem — GLTSCR1/GLTSCR1L (BICRA/BICRAL) subcomplexes
  "30343899": Mashtalir 2018 Cell — modular organisation and assembly of cBAF, PBAF, ncBAF
  "30397315": Michel 2018 Nat Cell Biol — ncBAF (BRD9/GLTSCR1) synthetic lethality
  "30510198": Gatchalian 2018 Nat Commun — BRD9-containing GBAF in mouse ES cells
  "32001526": He 2020 Science — cryo-EM of nucleosome-bound human cBAF (PDB 6LTJ)
  "33053319": Mashtalir 2020 Cell — structural model of endogenous human BAF
  "35477757": Yuan 2022 Nature — cryo-EM of nucleosome-bound human PBAF
  "36496390": Wang 2022 Nat Commun — cryo-EM of nucleosome-bound human PBAF
  "41402274": Chen 2025 Cell Discov — ncBAF recognizes the nucleosome through BCL7A (primary citation of PDB 9WBZ; verified against RCSB 2026-09-29)
  "42377898": Xu 2026 J Mol Cell Biol — structure of ncBAF assembly and nucleosome recognition (separate paper; not the 9WBZ citation; primary citation of PDB 21VV by title, RCSB lists no PMID 2026-09-30)
  "11780067": Lemon 2001 Nature — PBAF purified with BRG1 and not BRM (cited for this by Kadoch 2015)
  "30431433": Brien 2018 eLife — BRD9 degradation in synovial sarcoma; BRD9-containing GBAF/ncBAF
  "31015438": Wang 2019 Nat Commun — BRD9 defines a SWI/SNF sub-complex; vulnerability in rhabdoid tumours
  "31427792": Schick 2019 Nat Genet — 22 BAF subunit knockouts in HAP1; SMARCD1-BRD9-BICRA module; intra-complex synthetic lethalities
  "39014081": Malone 2024 Nat Rev Drug Discov — review (Malone & Roberts); Table 1 lists subunits per complex
  "26601204": Kadoch 2015 Sci Adv — review (Kadoch & Crabtree); p.8 PBAF contains BRG1 but not BRM

complexes:

  cBAF:
    name: canonical BAF
    synonyms: [BAF, cBAF]
    species: human
    structures:
      - {pdb: 6LTJ, method: cryo-EM, pmid: "32001526", note: nucleosome-bound; used for the cartoon layout}
      - {pdb: 9A0K, method: integrative, pmid: "33053319", note: "integrative (crosslinking-MS) model of endogenous nucleosome-bound BAF"}
    defining_pmids: ["8895581", "30343899"]
    slots:
      - slot: ATPase
        members: [SMARCA4, SMARCA2]
        pmids: ["8895581", "30343899"]
      - slot: ARID
        members: [ARID1A, ARID1B]
        pmids: ["11073988", "30343899"]
      - slot: SMARCC scaffold
        members: [SMARCC1, SMARCC2]
        stoichiometry: dimer; homo- or heterodimer of SMARCC1/SMARCC2
        pmids: ["8895581", "30343899"]
      - slot: SMARCD
        members: [SMARCD1, SMARCD2, SMARCD3]
        pmids: ["30343899"]
      - slot: SMARCE1
        members: [SMARCE1]
        pmids: ["8895581", "30343899"]
      - slot: SMARCB1
        members: [SMARCB1]
        pmids: ["8895581", "30343899"]
      - slot: DPF
        members: [DPF1, DPF2, DPF3]
        pmids: ["30343899"]
      - slot: SS18
        members: [SS18, SS18L1]
        pmids: ["22442726", "23540691", "30343899"]
      - slot: ARP module (actin-related)
        members: [ACTL6A, ACTL6B]
        pmids: ["8895581", "30343899"]
      - slot: ARP module (actin)
        members: [ACTB]
        pmids: ["8895581", "30343899"]
      - slot: BCL7
        members: [BCL7A, BCL7B, BCL7C]
        pmids: ["23644491", "30343899"]
    absent: [ARID2, PBRM1, BRD7, PHF10, BICRA, BICRAL, BRD9]

  PBAF:
    name: polybromo-associated BAF
    synonyms: [PBAF, SWI/SNF-B]
    species: human
    structures:
      - {pdb: 7VDV, method: cryo-EM, pmid: "35477757", note: "nucleosome-bound"}
      - {pdb: 7Y8R, method: cryo-EM, pmid: "36496390", note: "nucleosome-bound"}
    defining_pmids: ["11078522", "30343899"]
    slots:
      - slot: ATPase
        members: [SMARCA4, SMARCA2]
        pmids: ["11078522", "30343899"]
        contested: true
        contested_notes:
          - member: SMARCA2
            claim: "Xue 2000 and Lemon 2001 purified PBAF with BRG1 and not BRM (Kadoch 2015 p.8: \"Brg (but not Brm)\"); Mashtalir 2018 Fig. 6A-B detects SMARCA2 in ARID2- and PBRM1-bound PBAF from HEK293T cells (max spectral counts 61 and 56; SMARCA4 49 and 41), and Malone 2024 Table 1 lists SMARCA2 in PBAF."
            pmids: ["11078522", "11780067", "26601204", "30343899", "39014081"]
      - slot: ARID
        members: [ARID2]
        pmids: ["15985610", "30343899"]
      - slot: PBRM1
        members: [PBRM1]
        pmids: ["11078522", "30343899"]
      - slot: BRD7
        members: [BRD7]
        pmids: ["18809673", "30343899"]
      - slot: PHF10
        members: [PHF10]
        pmids: ["30343899"]
      - slot: SMARCB1
        members: [SMARCB1]
        pmids: ["11078522", "30343899"]
      - slot: SMARCE1
        members: [SMARCE1]
        pmids: ["30343899"]
      - slot: SMARCC scaffold
        members: [SMARCC1, SMARCC2]
        pmids: ["30343899"]
      - slot: SMARCD
        members: [SMARCD1, SMARCD2, SMARCD3]
        pmids: ["30343899"]
      - slot: ARP module (actin-related)
        members: [ACTL6A, ACTL6B]
        pmids: ["30343899"]
      - slot: ARP module (actin)
        members: [ACTB]
        pmids: ["30343899"]
      - slot: BCL7
        members: [BCL7A, BCL7B, BCL7C]
        pmids: ["23644491", "30343899", "39014081"]
        contested: true
        contested_notes:
          - claim: "Proteomic studies detect BCL7 proteins in PBAF purifications (Malone 2024 Table 1 lists BCL7A/B/C in PBAF); BCL7 is not modelled in the nucleosome-bound PBAF cryo-EM structures."
            pmids: ["23644491", "30343899", "39014081", "35477757", "36496390"]
    absent: [ARID1A, ARID1B, DPF1, DPF2, DPF3, SS18, SS18L1, BICRA, BICRAL, BRD9]

  ncBAF:
    name: non-canonical BAF
    synonyms: [ncBAF, GBAF]
    species: human
    structures:
      - {pdb: 9WBZ, method: cryo-EM, pmid: "41402274", note: "base module not resolved; unmodelled members shown as chips"}
      - {pdb: 21VV, method: cryo-EM, pmid: "42377898", note: "nucleosome-bound; second, independent ncBAF structure (not used for the 3D model)"}
    defining_pmids: ["29374058", "30343899", "30397315", "30431433", "31015438", "30510198"]
    slots:
      - slot: ATPase
        members: [SMARCA4, SMARCA2]
        pmids: ["29374058", "30343899", "30397315"]
      - slot: BICRA
        members: [BICRA, BICRAL]
        pmids: ["29374058", "30343899"]
      - slot: BRD9
        members: [BRD9]
        pmids: ["30343899", "30397315"]
      - slot: SMARCC scaffold
        members: [SMARCC1]
        pmids: ["29374058", "30343899", "39014081"]
        contested: true
        contested_notes:
          - member: SMARCC2
            claim: "ncBAF is described as SMARCC1-containing (Mashtalir 2018 Fig. 6D-E: SMARCC1 but no SMARCC2 in GLTSCR1L-bound ncBAF; Malone 2024 Table 1: SMARCC1 +, SMARCC2 –); SMARCC2 is listed as absent, but whether it is incorporated has differed between purifications."
            pmids: ["29374058", "30343899", "39014081"]
      - slot: SMARCD
        members: [SMARCD1]
        pmids: ["30343899", "30397315", "31427792", "39014081"]
        contested: true
        contested_notes:
          - member: [SMARCD2, SMARCD3]
            claim: "SMARCD1 is the SMARCD paralog reported in ncBAF (Mashtalir 2018 Fig. 6D-E: SMARCD1 only in GLTSCR1L-bound ncBAF; Malone 2024 Table 1: SMARCD2/SMARCD3 –; Schick 2019: a SMARCD1-BRD9-BICRA module, lost in SMARCD1 knockout cells); SMARCD2/SMARCD3 are listed as absent."
            pmids: ["30343899", "30397315", "31427792", "39014081"]
      - slot: SS18
        members: [SS18, SS18L1]
        pmids: ["30343899", "30397315"]
      - slot: ARP module (actin-related)
        members: [ACTL6A, ACTL6B]
        pmids: ["30343899"]
      - slot: ARP module (actin)
        members: [ACTB]
        pmids: ["30343899"]
      - slot: BCL7
        members: [BCL7A, BCL7B, BCL7C]
        pmids: ["30343899"]
    absent: [SMARCC2, SMARCD2, SMARCD3, SMARCB1, SMARCE1, ARID1A, ARID1B, ARID2, DPF1, DPF2, DPF3, PBRM1, BRD7, PHF10]

